<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICC 2026 视频录制日程</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --yellow:#fdd835;--blue:#42a5f5;--green:#66bb6a;
  --bg:#fff;--border:#e0e0e0;--text:#333;--text-light:#666;
  --header-bg:#fafafa;--shadow:0 2px 8px rgba(0,0,0,.12);
}
html{font-size:14px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
/* Header */
.header{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
.header h1{font-size:1.25rem;font-weight:700;white-space:nowrap}
.week-nav{display:flex;align-items:center;gap:6px}
.week-nav .week-label{font-size:.85rem;font-weight:600;color:var(--text-light);min-width:130px;text-align:center}
.nav-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:.85rem;transition:background .15s}
.nav-btn:hover{background:#f5f5f5}
.stats{display:flex;gap:14px;margin-left:auto;font-size:.85rem;color:var(--text-light)}
.stats .badge{background:#f0f0f0;padding:3px 10px;border-radius:12px;font-weight:600}
.stats .badge.done{background:#e8f5e9;color:#2e7d32}
.stats .badge.today{background:#e3f2fd;color:#1565c0}
.stats .badge.prep{background:#fff9c4;color:#f57f17}
/* Main Layout */
.main{flex:1;overflow:hidden}
/* Schedule Grid */
.schedule-wrapper{width:100%;height:100%;overflow:auto;position:relative}
.schedule-grid{display:grid;grid-template-columns: 60px repeat(4,1fr);min-width:600px;position:relative}
.grid-header{background:var(--header-bg);position:sticky;top:0;z-index:10;border-bottom:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;padding:8px 4px}
.grid-header.today-col{background:#e3f2fd}
.time-label{grid-column:1;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;font-size:.7rem;color:var(--text-light);font-weight:500;border-right:1px solid var(--border);border-bottom:1px solid #f5f5f5}
.cell{border-right:1px solid #f0f0f0;border-bottom:1px solid #f5f5f5;min-height:52px;position:relative;overflow:visible;transition:background .15s}
.cell:hover{background:#f8f9ff}
.cell.today-col{background:#fafcff}
.task-block{position:absolute;left:3px;right:3px;border-radius:5px;padding:4px 6px;font-size:.72rem;color:#333;z-index:5;overflow:hidden;line-height:1.3;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.task-block .task-name{font-weight:700;font-size:.75rem}
.task-block .task-project{font-size:.65rem;opacity:.85}
.task-block.type-prep{background:var(--yellow)}
.task-block.type-record{background:var(--blue);color:#fff}
.task-block.type-done{background:var(--green);color:#fff}
/* Responsive */
@media(max-width:768px){
  .schedule-grid{min-width:600px}
  .header h1{font-size:1rem}
  .stats{font-size:.75rem;gap:8px;flex-wrap:wrap}
  .week-nav .week-label{min-width:90px;font-size:.8rem}
}
</style>
</head>
<body>

<div class="header">
  <h1>🎬 ICC 2026 视频录制日程</h1>
  <div class="week-nav">
    <button class="nav-btn" onclick="changeWeek(-1)">◀</button>
    <span class="week-label" id="weekLabel"></span>
    <button class="nav-btn" onclick="changeWeek(1)">▶</button>
  </div>
  <div class="stats">
    <span class="badge prep" id="statPrep">资料准备: 0</span>
    <span class="badge" id="statRecord">待录制: 0</span>
    <span class="badge done" id="statDone">已完成: 0</span>
    <span class="badge today" id="statToday">今日安排: 0</span>
  </div>
</div>

<div class="main">
  <div class="schedule-wrapper" id="scheduleWrapper">
    <div class="schedule-grid" id="scheduleGrid"></div>
  </div>
</div>

<script>
// ================================================================
//  📅 日程数据 — 修改此处即可更新页面显示
//
//  type: 'prepare' (黄色/资料准备)
//      | 'record'  (蓝色/视频录制)
//      | 'done'    (绿色/已完成)
//  date: 'YYYY-MM-DD'
//  time: 起始小时 (整数, 8-19)
//  duration: 持续小时数
//  student: 学生姓名
//  project: 项目名称
// ================================================================
const scheduleData = [
  { date: '2026-06-12', time: 17, duration: 2, student: '林辰', project: '防溢饮水机', type: 'record' },
  { date: '2026-06-12', time: 17, duration: 2, student: '王雨腾', project: '课堂转录助手', type: 'record' },
  { date: '2026-06-12', time: 17, duration: 2, student: '许皓然', project: '预警头盔', type: 'record' },
  { date: '2026-06-12', time: 17, duration: 2, student: '宋芝玥', project: '鹦鹉好声音', type: 'record' },
  { date: '2026-06-13', time: 15, duration: 1.5, student: '孙艺绮', project: 'ICC项目', type: 'record' },
  { date: '2026-06-13', time: 15, duration: 1.5, student: '王潇然', project: '配速车', type: 'record' },
  { date: '2026-06-14', time: 17, duration: 1.5, student: '高雨泽', project: '宠物减肥机器人', type: 'record' },
];
// ================================================================

const DAYS = ['周四','周五','周六','周日'];
const HOURS = [];
for (let h = 9; h <= 21; h++) HOURS.push(h);
const DAY_MS = 86400000;

function getThursday(d) {
  d = new Date(d);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 4);
  return new Date(d.setDate(diff));
}

function formatDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

let currentWeekThursday = getThursday(new Date());

// ============ HELPERS ============
function getTodayDayIndex() {
  const today = new Date();
  const thu = getThursday(today);
  const diff = Math.round((today - thu) / DAY_MS);
  return diff >= 0 && diff <= 3 ? diff : -1;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============ RENDER GRID ============
function renderGrid() {
  const grid = document.getElementById('scheduleGrid');
  grid.innerHTML = '';
  const todayIdx = getTodayDayIndex();

  const corner = document.createElement('div');
  corner.className = 'grid-header';
  corner.textContent = '时段';
  grid.appendChild(corner);

  DAYS.forEach((d, i) => {
    const hdr = document.createElement('div');
    hdr.className = 'grid-header' + (i === todayIdx ? ' today-col' : '');
    const date = new Date(currentWeekThursday.getTime() + i * DAY_MS);
    const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;
    hdr.textContent = `${d} ${dateStr}`;
    grid.appendChild(hdr);
  });

  HOURS.forEach(hour => {
    const label = document.createElement('div');
    label.className = 'time-label';
    label.textContent = `${hour}:00`;
    label.style.gridRowStart = HOURS.indexOf(hour) + 2;
    grid.appendChild(label);

    DAYS.forEach((d, dayIdx) => {
      const date = new Date(currentWeekThursday.getTime() + dayIdx * DAY_MS);
      const dateStr = formatDateStr(date);
      const cell = document.createElement('div');
      cell.className = 'cell' + (dayIdx === todayIdx ? ' today-col' : '');
      cell.style.gridRowStart = HOURS.indexOf(hour) + 2;
      cell.style.gridColumnStart = dayIdx + 2;
      cell.dataset.date = dateStr;
      cell.dataset.hour = hour;
      grid.appendChild(cell);
    });
  });

  renderSchedule(scheduleData);
  updateStats();
  updateWeekLabel();
}

// ============ RENDER SCHEDULE (data-driven) ============
function renderSchedule(data) {
  document.querySelectorAll('.task-block').forEach(el => el.remove());
  const CELL_HEIGHT = 52;

  // Group entries by date+time to handle overlaps
  const groups = {};
  data.forEach(entry => {
    const key = `${entry.date}|${entry.time}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(entry);
  });

  Object.entries(groups).forEach(([key, entries]) => {
    const [date, time] = key.split('|');
    const cell = document.querySelector(
      `.cell[data-date="${date}"][data-hour="${parseInt(time)}"]`
    );
    if (!cell) return;

    const count = entries.length;
    const gap = 2;

    entries.forEach((entry, idx) => {
      const block = document.createElement('div');
      const typeClass = entry.type === 'prepare' ? 'type-prep'
                      : entry.type === 'record'  ? 'type-record'
                      : 'type-done';
      block.className = `task-block ${typeClass}`;
      const duration = entry.duration || 1;
      const startHour = entry.time;
      const endHour = startHour + (entry.durationMin ? entry.durationMin / 60 : duration);
      const endH = Math.floor(endHour);
      const endM = Math.round((endHour - endH) * 60);
      const timeLabel = `${startHour}:${String(0).padStart(2,'0')} - ${endH}:${String(endM).padStart(2,'0')}`;
      block.innerHTML = `<div class="task-name">${escHtml(entry.student)}</div><div class="task-project">${escHtml(entry.project)} ${timeLabel}</div>`;
      block.style.top = '2px';
      block.style.height = (duration * CELL_HEIGHT - 4) + 'px';
      // Distribute horizontally when overlapping
      const slotWidth = (100 - gap * (count + 1)) / count;
      block.style.left = (gap + idx * (slotWidth + gap)) + '%';
      block.style.width = slotWidth + '%';
      block.style.right = 'auto';
      cell.appendChild(block);
    });
  });
}

// ============ WEEK NAV ============
function changeWeek(dir) {
  currentWeekThursday = new Date(currentWeekThursday.getTime() + dir * 7 * DAY_MS);
  renderGrid();
}

function updateWeekLabel() {
  const end = new Date(currentWeekThursday.getTime() + 3 * DAY_MS);
  const m1 = currentWeekThursday.getMonth() + 1;
  const d1 = currentWeekThursday.getDate();
  const m2 = end.getMonth() + 1;
  const d2 = end.getDate();
  document.getElementById('weekLabel').textContent = `${m1}/${d1} — ${m2}/${d2}`;
}

// ============ STATS ============
function updateStats() {
  const prepCount = scheduleData.filter(e => e.type === 'prepare').length;
  const recordCount = scheduleData.filter(e => e.type === 'record').length;
  const doneCount = scheduleData.filter(e => e.type === 'done').length;
  document.getElementById('statPrep').textContent = `资料准备: ${prepCount}`;
  document.getElementById('statRecord').textContent = `待录制: ${recordCount}`;
  document.getElementById('statDone').textContent = `已完成: ${doneCount}`;

  const todayStr = formatDateStr(new Date());
  const todayCount = scheduleData.filter(e => e.date === todayStr).length;
  document.getElementById('statToday').textContent = `今日安排: ${todayCount}`;
}

// ============ INIT ============
renderGrid();
</script>
</body>
</html>
