<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICC 2026 视频录制日程</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --yellow:#fdd835;--blue:#42a5f5;--green:#66bb6a;
  --bg:#fff;--border:#e0e0e0;--text:#333;--text-light:#666;
  --header-bg:#fafafa;--shadow:0 2px 8px rgba(0,0,0,.12);
}
html{font-size:14px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
/* Header */
.header{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
.header h1{font-size:1.25rem;font-weight:700;white-space:nowrap}
.week-nav{display:flex;align-items:center;gap:6px}
.week-nav .week-label{font-size:.85rem;font-weight:600;color:var(--text-light);min-width:130px;text-align:center}
.nav-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:.85rem;transition:background .15s}
.nav-btn:hover{background:#f5f5f5}
.stats{display:flex;gap:14px;margin-left:auto;font-size:.85rem;color:var(--text-light)}
.stats .badge{background:#f0f0f0;padding:3px 10px;border-radius:12px;font-weight:600}
.stats .badge.done{background:#e8f5e9;color:#2e7d32}
.stats .badge.today{background:#e3f2fd;color:#1565c0}
.stats .badge.prep{background:#fff9c4;color:#f57f17}
/* Main Layout */
.main{flex:1;overflow:hidden}
/* Schedule Grid */
.schedule-wrapper{width:100%;height:100%;overflow:auto;position:relative}
.schedule-grid{display:grid;grid-template-columns: 60px repeat(4,1fr);min-width:600px;position:relative}
.grid-header{background:var(--header-bg);position:sticky;top:0;z-index:10;border-bottom:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;padding:8px 4px}
.grid-header.today-col{background:#e3f2fd}
.time-label{grid-column:1;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;font-size:.7rem;color:var(--text-light);font-weight:500;border-right:1px solid var(--border);border-bottom:1px solid #f5f5f5}
.cell{border-right:1px solid #f0f0f0;border-bottom:1px solid #f5f5f5;min-height:52px;position:relative;overflow:visible;transition:background .15s}
.cell:hover{background:#f8f9ff}
.cell.today-col{background:#fafcff}
.task-block{position:absolute;left:3px;right:3px;border-radius:5px;padding:4px 6px;font-size:.72rem;color:#333;z-index:5;overflow:hidden;line-height:1.3;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.task-block .task-name{font-weight:700;font-size:.75rem}
.task-block .task-project{font-size:.65rem;opacity:.85}
.task-block.type-prep{background:var(--yellow)}
.task-block.type-record{background:var(--blue);color:#fff}
.task-block.type-done{background:var(--green);color:#fff}
/* Todo Widget */
.todo-widget{position:fixed;bottom:20px;right:20px;width:280px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);z-index:200;display:flex;flex-direction:column;transition:height .25s}
.todo-widget.dragging{opacity:.9;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.todo-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none;border-bottom:1px solid var(--border);border-radius:10px 10px 0 0;background:#fafafa;font-weight:700;font-size:.9rem}
.todo-header .toggle-btn{cursor:pointer;font-size:1.1rem;padding:0 4px}
.todo-body{max-height:300px;overflow-y:auto;padding:6px 0}
.todo-body.collapsed{display:none}
.todo-item{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:.82rem}
.todo-item input[type=checkbox]{accent-color:var(--green);width:16px;height:16px;cursor:pointer}
.todo-item.done span.todo-text{text-decoration:line-through;color:#aaa}
.todo-item .delete-todo{margin-left:auto;cursor:pointer;color:#ccc;font-size:.8rem;padding:2px}
.todo-item .delete-todo:hover{color:#e53935}
.todo-add{display:flex;border-top:1px solid var(--border);padding:8px 10px;gap:6px}
.todo-add input{flex:1;border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:.8rem;outline:none}
.todo-add input:focus{border-color:var(--blue)}
.todo-add button{border:none;background:var(--blue);color:#fff;border-radius:5px;padding:5px 12px;cursor:pointer;font-size:.8rem}
/* Responsive */
@media(max-width:768px){
  .schedule-grid{min-width:600px}
  .todo-widget{width:240px;right:10px;bottom:10px}
  .header h1{font-size:1rem}
  .stats{font-size:.75rem;gap:8px;flex-wrap:wrap}
  .week-nav .week-label{min-width:90px;font-size:.8rem}
}
</style>
</head>
<body>

<div class="header">
  <h1>🎬 ICC 2026 视频录制日程</h1>
  <div class="week-nav">
    <button class="nav-btn" onclick="changeWeek(-1)">◀</button>
    <span class="week-label" id="weekLabel"></span>
    <button class="nav-btn" onclick="changeWeek(1)">▶</button>
  </div>
  <div class="stats">
    <span class="badge prep" id="statPrep">资料准备: 0</span>
    <span class="badge" id="statRecord">待录制: 0</span>
    <span class="badge done" id="statDone">已完成: 0</span>
    <span class="badge today" id="statToday">今日安排: 0</span>
  </div>
</div>

<div class="main">
  <div class="schedule-wrapper" id="scheduleWrapper">
    <div class="schedule-grid" id="scheduleGrid"></div>
  </div>
</div>

<!-- Todo Widget -->
<div class="todo-widget" id="todoWidget">
  <div class="todo-header" id="todoHeader">
    <span>📝 待办事项</span>
    <span class="toggle-btn" id="todoToggle">▼</span>
  </div>
  <div class="todo-body" id="todoBody"></div>
  <div class="todo-add">
    <input type="text" id="todoInput" placeholder="新增待办..." maxlength="50">
    <button onclick="addTodo()">添加</button>
  </div>
</div>

<script>
// ================================================================
//  📅 日程数据 — 修改此处即可更新页面显示
//
//  type: 'prepare' (黄色/资料准备)
//      | 'record'  (蓝色/视频录制)
//      | 'done'    (绿色/已完成)
//  date: 'YYYY-MM-DD'
//  time: 起始小时 (整数, 8-19)
//  duration: 持续小时数
//  student: 学生姓名
//  project: 项目名称
// ================================================================
const scheduleData = [
  { date: '2026-06-12', time: 17, duration: 1.5, student: '林辰', project: '防溢饮水机', type: 'record' },
  { date: '2026-06-12', time: 17, duration: 1.5, student: '王雨腾', project: '课堂转录助手', type: 'record' },
  { date: '2026-06-15', time: 16, duration: 2, student: '高雨泽', project: '宠物减肥机器人', type: 'record' },
 
];
// ================================================================

const DAYS = ['周四','周五','周六','周日'];
const HOURS = [];
for (let h = 9; h <= 21; h++) HOURS.push(h);
const DAY_MS = 86400000;

function getThursday(d) {
  d = new Date(d);
  const day = d.getDay(); // 0=Sun ... 4=Thu
  const diff = d.getDate() - day + (day === 0 ? -6 : 4);
  return new Date(d.setDate(diff));
}

function formatDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

let currentWeekThursday = getThursday(new Date());

// ============ PERSISTENCE (todos only) ============
let todos = [];
let todoIdCounter = 1;

function saveTodos() {
  localStorage.setItem('icc-todos', JSON.stringify({ todos, todoIdCounter }));
}
function loadTodos() {
  const raw = localStorage.getItem('icc-todos');
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    todos = data.todos || [];
    todoIdCounter = data.todoIdCounter || 1;
    return true;
  } catch (e) { return false; }
}

function getDefaultTodos() {
  return [
    { id: todoIdCounter++, text: '展板确认', done: false },
    { id: todoIdCounter++, text: '视频稿确认', done: false },
    { id: todoIdCounter++, text: '签章素材确认', done: false },
    { id: todoIdCounter++, text: '提交最终资料(截止6/15)', done: false },
  ];
}

// ============ RENDER GRID ============
function getTodayDayIndex() {
  const today = new Date();
  const thu = getThursday(today);
  const diff = Math.round((today - thu) / DAY_MS);
  return diff >= 0 && diff <= 3 ? diff : -1;
}

function renderGrid() {
  const grid = document.getElementById('scheduleGrid');
  grid.innerHTML = '';
  const todayIdx = getTodayDayIndex();

  // Corner cell
  const corner = document.createElement('div');
  corner.className = 'grid-header';
  corner.textContent = '时段';
  grid.appendChild(corner);

  // Day headers
  DAYS.forEach((d, i) => {
    const hdr = document.createElement('div');
    hdr.className = 'grid-header' + (i === todayIdx ? ' today-col' : '');
    const date = new Date(currentWeekThursday.getTime() + i * DAY_MS);
    const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;
    hdr.textContent = `${d} ${dateStr}`;
    grid.appendChild(hdr);
  });

  // Time rows
  HOURS.forEach(hour => {
    const label = document.createElement('div');
    label.className = 'time-label';
    label.textContent = `${hour}:00`;
    label.style.gridRowStart = HOURS.indexOf(hour) + 2;
    grid.appendChild(label);

    DAYS.forEach((d, dayIdx) => {
      const date = new Date(currentWeekThursday.getTime() + dayIdx * DAY_MS);
      const dateStr = formatDateStr(date);
      const cell = document.createElement('div');
      cell.className = 'cell' + (dayIdx === todayIdx ? ' today-col' : '');
      cell.style.gridRowStart = HOURS.indexOf(hour) + 2;
      cell.style.gridColumnStart = dayIdx + 2;
      cell.dataset.date = dateStr;
      cell.dataset.hour = hour;
      grid.appendChild(cell);
    });
  });

  renderSchedule(scheduleData);
  updateStats();
  updateWeekLabel();
}

// ============ RENDER SCHEDULE (data-driven) ============
function renderSchedule(data) {
  document.querySelectorAll('.task-block').forEach(el => el.remove());
  const CELL_HEIGHT = 52;

  data.forEach(entry => {
    const cell = document.querySelector(
      `.cell[data-date="${entry.date}"][data-hour="${entry.time}"]`
    );
    if (!cell) return; // not in current week view

    const block = document.createElement('div');
    const typeClass = entry.type === 'prepare' ? 'type-prep'
                    : entry.type === 'record'  ? 'type-record'
                    : 'type-done';
    block.className = `task-block ${typeClass}`;
    const duration = entry.duration || 1;
    const startHour = entry.time;
    const endHour = startHour + (entry.durationMin ? entry.durationMin / 60 : duration);
    const endH = Math.floor(endHour);
    const endM = Math.round((endHour - endH) * 60);
    const timeLabel = `${startHour}:${String(0).padStart(2,'0')} - ${endH}:${String(endM).padStart(2,'0')}`;
    block.innerHTML = `<div class="task-name">${escHtml(entry.student)} ${timeLabel}</div>`;
    block.style.top = '2px';
    block.style.height = (duration * CELL_HEIGHT - 4) + 'px';
    cell.appendChild(block);
  });
}

// ============ WEEK NAV ============
function changeWeek(dir) {
  currentWeekThursday = new Date(currentWeekThursday.getTime() + dir * 7 * DAY_MS);
  renderGrid();
}

function updateWeekLabel() {
  const end = new Date(currentWeekThursday.getTime() + 3 * DAY_MS);
  const m1 = currentWeekThursday.getMonth() + 1;
  const d1 = currentWeekThursday.getDate();
  const m2 = end.getMonth() + 1;
  const d2 = end.getDate();
  document.getElementById('weekLabel').textContent = `${m1}/${d1} — ${m2}/${d2}`;
}

// ============ STATS ============
function updateStats() {
  const prepCount = scheduleData.filter(e => e.type === 'prepare').length;
  const recordCount = scheduleData.filter(e => e.type === 'record').length;
  const doneCount = scheduleData.filter(e => e.type === 'done').length;
  document.getElementById('statPrep').textContent = `资料准备: ${prepCount}`;
  document.getElementById('statRecord').textContent = `待录制: ${recordCount}`;
  document.getElementById('statDone').textContent = `已完成: ${doneCount}`;

  const todayStr = formatDateStr(new Date());
  const todayCount = scheduleData.filter(e => e.date === todayStr).length;
  document.getElementById('statToday').textContent = `今日安排: ${todayCount}`;
}

// ============ TODO ============
function renderTodos() {
  const body = document.getElementById('todoBody');
  body.innerHTML = '';
  todos.forEach(t => {
    const el = document.createElement('div');
    el.className = 'todo-item' + (t.done ? ' done' : '');
    el.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${t.id})">
      <span class="todo-text">${escHtml(t.text)}</span>
      <span class="delete-todo" onclick="deleteTodo(${t.id})">✕</span>`;
    body.appendChild(el);
  });
}

function addTodo() {
  const input = document.getElementById('todoInput');
  const text = input.value.trim();
  if (!text) return;
  todos.push({ id: todoIdCounter++, text, done: false });
  input.value = '';
  saveTodos();
  renderTodos();
}

function toggleTodo(id) {
  const t = todos.find(x => x.id === id);
  if (t) t.done = !t.done;
  saveTodos();
  renderTodos();
}

function deleteTodo(id) {
  todos = todos.filter(x => x.id !== id);
  saveTodos();
  renderTodos();
}

// Todo widget drag (move position)
function initTodoDrag() {
  const widget = document.getElementById('todoWidget');
  const header = document.getElementById('todoHeader');
  let isDragging = false, startX, startY, startLeft, startTop;

  header.addEventListener('mousedown', (e) => {
    if (e.target.id === 'todoToggle') return;
    isDragging = true;
    widget.classList.add('dragging');
    const rect = widget.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    startLeft = rect.left; startTop = rect.top;
    widget.style.right = 'auto'; widget.style.bottom = 'auto';
    widget.style.left = startLeft + 'px'; widget.style.top = startTop + 'px';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    widget.style.left = (startLeft + e.clientX - startX) + 'px';
    widget.style.top = (startTop + e.clientY - startY) + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (isDragging) { isDragging = false; widget.classList.remove('dragging'); }
  });

  // Touch support
  header.addEventListener('touchstart', (e) => {
    if (e.target.id === 'todoToggle') return;
    isDragging = true;
    const touch = e.touches[0];
    const rect = widget.getBoundingClientRect();
    startX = touch.clientX; startY = touch.clientY;
    startLeft = rect.left; startTop = rect.top;
    widget.style.right = 'auto'; widget.style.bottom = 'auto';
    widget.style.left = startLeft + 'px'; widget.style.top = startTop + 'px';
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const touch = e.touches[0];
    widget.style.left = (startLeft + touch.clientX - startX) + 'px';
    widget.style.top = (startTop + touch.clientY - startY) + 'px';
  }, { passive: true });

  document.addEventListener('touchend', () => { isDragging = false; });

  // Toggle collapse
  document.getElementById('todoToggle').addEventListener('click', () => {
    const body = document.getElementById('todoBody');
    const add = document.querySelector('.todo-add');
    const isCollapsed = body.classList.toggle('collapsed');
    add.style.display = isCollapsed ? 'none' : 'flex';
    document.getElementById('todoToggle').textContent = isCollapsed ? '▶' : '▼';
  });

  // Enter key
  document.getElementById('todoInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });
}

// ============ HELPERS ============
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============ INIT ============
(function init() {
  if (!loadTodos()) {
    todos = getDefaultTodos();
  }
  renderGrid();
  renderTodos();
  initTodoDrag();
})();
</script>
</body>
</html>
